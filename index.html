<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled by Bayan | Outfit Inspo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            color: #1a1a1a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* العنوان الثابت في الأعلى */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: #ffffff;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            padding: 12px 15px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        header h1 {
            font-size: 1.3rem;
            margin: 0;
            color: #1a1a1a;
            font-weight: 700;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .outfit-description {
            text-align: center;
            font-size: 0.85rem;
            color: #555555;
            margin: 15px 0 20px 0;
            line-height: 1.4;
            font-weight: 500;
        }

        .main-look {
            margin-bottom: 25px;
            text-align: center;
        }

        .main-look img {
            max-width: 100%;
            height: auto;
            border-radius: 14px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .grid-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* تنسيق صور القطع بدون إطارات إضافية أو كلمة Item */
        .item-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .shop-btn {
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Styled by Bayan</h1>
    </header>

    <div class="container">
        <div class="outfit-description">
            Chic Olive & Gold Elegant Summer Dress Outfit Featuring Sophisticated Style
        </div>

        <!-- صورة التنسيق الكبيرة في الأعلى -->
        <div class="main-look">
            <img src="<a href="https://ibb.co/XfpGr6TP"><img src="https://i.ibb.co/8n2QLGVw/IMG-20260724-135232-307.jpg" alt="IMG-20260724-135232-307" border="0"></a>" alt="">
        </div>
        
        <!-- القطع المنفردة -->
        <div class="grid-items">
            <!-- القطعة الأولى -->
            <div class="item-card">
                <img src="هنا_رابط_صورة_القطعة_1" alt="">
                <a href="هنا_رابط_أفيلييت_القطعة_1" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة الثانية -->
            <div class="item-card">
                <img src="هنا_رابط_صورة_القطعة_2" alt="">
                <a href="هنا_رابط_أفيلييت_القطعة_2" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة الثالثة -->
            <div class="item-card">
                <img src="هنا_رابط_صورة_القطعة_3" alt="">
                <a href="هنا_رابط_أفيلييت_القطعة_3" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة الرابعة -->
            <div class="item-card">
                <img src="هنا_رابط_صورة_القطعة_4" alt="">
                <a href="هنا_رابط_أفيلييت_القطعة_4" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة الخامسة -->
            <div class="item-card">
                <img src="هنا_رابط_صورة_القطعة_5" alt="">
                <a href="هنا_رابط_أفيلييت_القطعة_5" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة السادسة -->
            <div class="item-card">
                <img src="هنا_رابط_صورة_القطعة_6" alt="">
                <a href="هنا_رابط_أفيلييت_القطعة_6" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>
        </div>
    </div>

</body>
</html>
