<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Styled by Bayan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#f7f5f2;

font-family:'Inter',sans-serif;

color:#2d2d2d;

line-height:1.6;

}

/*==========================
HEADER
==========================*/

header{

position:sticky;

top:0;

z-index:999;

background:#f7f5f2;

padding:18px 20px;

text-align:center;

border-bottom:1px solid #ece8e2;

}

header h1{

font-family:'Cormorant Garamond',serif;

font-size:36px;

font-weight:600;

letter-spacing:1px;

}

/*==========================
MAIN CONTAINER
==========================*/

.container{

max-width:700px;

margin:auto;

padding:28px 18px 70px;

}

/*==========================
LOOK DESCRIPTION
==========================*/

.look-description{

font-size:16px;

text-align:center;

color:#555;

margin-bottom:28px;

}

/*==========================
MAIN LOOK IMAGE
==========================*/

.hero-image{

width:100%;

border-radius:26px;

overflow:hidden;

background:white;

box-shadow:0 10px 30px rgba(0,0,0,.06);

margin-bottom:28px;

}

.hero-image img{

width:100%;

display:block;

}

/*==========================
PRODUCT GRID
==========================*/

.products{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

.product{

display:block;

text-decoration:none;

background:white;

border-radius:24px;

overflow:hidden;

box-shadow:0 8px 20px rgba(0,0,0,.05);

transition:.25s;

}

.product:hover{

transform:translateY(-4px);

}

.product img{

width:100%;

display:block;

background:white;

}/*==========================
SHOP BUTTON
==========================*/

.shop-btn{

display:block;

margin:16px;

padding:14px;

background:#111;

color:white;

text-align:center;

border-radius:14px;

font-size:16px;

font-weight:500;

}

/*==========================
FOOTER
==========================*/

footer{

text-align:center;

padding:40px 0 10px;

font-size:14px;

color:#8c8c8c;

}

</style>

</head>

<body>

<header>

<h1>Styled by Bayan</h1>

</header>

<div class="container">

</div>

</div>

</body>

</html>
