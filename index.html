<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Styled by Bayan</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #faf7f2;
    color: #333;
}

header {
    position: sticky;
    top: 0;
    background: #faf7f2;
    padding: 18px;
    text-align: center;
    font-size: 24px;
    letter-spacing: 2px;
    border-bottom: 1px solid #ddd;
    z-index: 100;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 28px;
    margin-top: 20px;
}

.description {
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 30px;
}

.main-look {
    width: 100%;
    border-radius: 12px;
}

.shop-title {
    margin-top: 40px;
    font-size: 22px;
}

.items {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 25px;
}

.item {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.item a {
    text-decoration: none;
    color: inherit;
    display: block;
}

.item img {
    width: 100%;
    display: block;
}

.item-name {
    padding: 12px;
    font-size: 16px;
}

.shop-button {
    padding: 12px;
    font-size: 14px;
    letter-spacing: 1px;
}

@media (max-width: 600px) {
    .items {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
}
</style>

</head>

<body>

<header>
Styled by Bayan
</header>

<div class="container">

<h1>Elegant Summer Look</h1>

<p class="description">
A feminine and timeless outfit carefully selected to create an elegant everyday style.
</p>

<img class="main-look" src="images/look1.jpg" alt="Full Look">

<h2 class="shop-title">Shop The Look</h2>


<div class="items">


<div class="item">
<a href="YOUR-SHEIN-AFFILIATE-LINK">
<img src="images/pants.jpg" alt="Pants">
<div class="item-name">Elegant Pants</div>
<div class="shop-button">Shop on Shein</div>
</a>
</div>


<div class="item">
<a href="YOUR-SHEIN-AFFILIATE-LINK">
<img src="images/top.jpg" alt="Top">
<div class="item-name">Stylish Top</div>
<div class="shop-button">Shop on Shein</div>
</a>
</div>


<div class="item">
<a href="YOUR-SHEIN-AFFILIATE-LINK">
<img src="images/shoes.jpg" alt="Shoes">
<div class="item-name">Shoes</div>
<div class="shop-button">Shop on Shein</div>
</a>
</div>


<div class="item">
<a href="YOUR-SHEIN-AFFILIATE-LINK">
<img src="images/bag.jpg" alt="Bag">
<div class="item-name">Bag</div>
<div class="shop-button">Shop on Shein</div>
</a>
</div>


</div>

</div>

</body>
</html>
