<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled by Bayan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #333;
        }

        header {
            background-color: #ffffff;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            letter-spacing: 1px;
            color: #111;
        }

        .outfit-description {
            font-size: 13px;
            color: #555;
            margin: 12px auto 20px auto;
            max-width: 90%;
            line-height: 1.5;
            font-weight: normal;
        }

        .main-image-container {
            padding: 0 15px;
            margin-bottom: 25px;
        }

        .main-image {
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            display: block;
            margin: 0 auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px 30px 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .item-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 10px;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            padding: 8px 10px;
            font-size: 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .shop-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>Styled by Bayan</h1>
        
        <!-- مكاني هنا: اكتبي وصف التنسيق واستخدمي <br> لنزول السطر -->
        <div class="outfit-description">
            Chic Olive & Gold Elegant Summer Dress<br>Outfit Featuring Sophisticated Style
        </div>
    </header>

    <!-- الصورة الكبيرة -->
    <div class="main-image-container">
        <img src="https://i.ibb.co/zcdTNYD/IMG-20260725-174837-753.jpg" alt="Outfit Inspo" class="main-image">
    </div>

    <!-- شبكة القطع الستة الفردية -->
    <div class="grid-container">
        
        <!-- القطعة الأولى -->
        <div class="item-card">
            <img src="رابط_صورة_القطعة_1" alt="Item 1">
            <a href="رابط_أفيلييت_القطعة_1" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
        </div>

        <!-- القطعة الثانية -->
        <div class="item-card">
            <img src="رابط_صورة_القطعة_2" alt="Item 2">
            <a href="رابط_أفيلييت_القطعة_2" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
        </div>

        <!-- القطعة الثالثة -->
        <div class="item-card">
            <img src="رابط_صورة_القطعة_3" alt="Item 3">
            <a href="رابط_أفيلييت_القطعة_3" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
        </div>

        <!-- القطعة الرابعة -->
        <div class="item-card">
            <img src="رابط_صورة_القطعة_4" alt="Item 4">
            <a href="رابط_أفيلييت_القطعة_4" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
        </div>

        <!-- القطعة الخامسة -->
        <div class="item-card">
            <img src="رابط_صورة_القطعة_5" alt="Item 5">
            <a href="رابط_أفيلييت_القطعة_5" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
        </div>

        <!-- القطعة السادسة -->
        <div class="item-card">
            <img src="رابط_صورة_القطعة_6" alt="Item 6">
            <a href="رابط_أفيلييت_القطعة_6" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
        </div>

    </div>

</body>
</html>
