<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled by Bayan | Outfit Inspo</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* رأس الصفحة الثابت في الأعلى */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        header h1 {
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            margin: 0 0 4px 0;
            color: var(--text-primary);
            font-weight: 700;
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.3;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .main-look {
            margin-bottom: 25px;
            text-align: center;
        }

        .main-look img {
            width: 100%;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .grid-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .item-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .item-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .shop-btn {
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .shop-btn:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <!-- العنوان الثابت في الأعلى -->
    <header>
        <h1>Styled by Bayan</h1>
        <p>Chic Olive & Gold Elegant Summer Dress Outfit</p>
    </header>

    <div class="container">
        <!-- صورة التنسيق الكاملة في الأعلى -->
        <div class="main-look">
            <!-- تم وضع رابط صورتكِ الأولى هنا -->
            <img src="https://i.ibb.co/XfpGr6TP/IMG-20260724-135232-307.jpg" alt="Full Outfit Look">
            </div>
        
        <!-- شبكة القطع المنفردة (بدون أسماء) -->
        <div class="grid-items">
            <!-- القطعة 1 -->
            <div class="item-card">
                <img src="رابط_صورة_الحقيبة" alt="Item">
                <a href="رابط_أفيلييت_الحقيبة" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة 2 -->
            <div class="item-card">
                <img src="رابط_صورة_الفستان" alt="Item">
                <a href="رابط_أفيلييت_الفستان" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة 3 -->
            <div class="item-card">
                <img src="رابط_صورة_الحذاء" alt="Item">
                <a href="رابط_أفيلييت_الحذاء" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة 4 -->
            <div class="item-card">
                <img src="رابط_صورة_الساعة" alt="Item">
                <a href="رابط_أفيلييت_الساعة" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة 5 -->
            <div class="item-card">
                <img src="رابط_صورة_الخاتم" alt="Item">
                <a href="رابط_أفيلييت_الخاتم" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>

            <!-- القطعة 6 -->
            <div class="item-card">
                <img src="رابط_صورة_الحلق" alt="Item">
                <a href="رابط_أفيلييت_الحلق" target="_blank" class="shop-btn">🛒 Shop on Shein</a>
            </div>
        </div>
    </div>

</body>
</html>
