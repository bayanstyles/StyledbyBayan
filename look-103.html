<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAYAN STYLING</title>

<link rel="icon" type="image/png" href="favicon_png">

<meta property="og:title" content="BAYAN STYLING">

<meta property="og:description" content="Shop this look">

<meta property="og:image" content="images_look_jpg">

<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

background:#FCFCFA;

font-family:'Inter',sans-serif;

color:#2d2d2d;

line-height:1.7;

}

/*========================
HEADER
========================*/

header{

position:sticky;

top:0;

z-index:999;

background:#FCFCFA;

padding:10px 22px;

border-bottom:1px solid #F1F1ED;

}

header h1{

text-align:center;

font-family:'Cormorant Garamond',serif;

font-size:29px;

font-weight:600;

letter-spacing:.8px;

color:#1f1f1f;

}

/*========================
MAIN CONTAINER
========================*/

.container{

max-width:720px;

margin:auto;

padding:26px 18px 70px;

}

/*========================
MAIN LOOK IMAGE
========================*/

.hero-image{

background:#ffffff;

border-radius:26px;

overflow:hidden;

box-shadow:0 5px 18px rgba(0,0,0,.04);

margin-bottom:24px;

}

.hero-image img{

width:100%;

display:block;

object-fit:cover;

}

/*========================
PRODUCT GRID
========================*/

.products{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:18px;

}

.product{

display:flex;

flex-direction:column;

text-decoration:none;

background:#ffffff;

border-radius:22px;

overflow:hidden;

box-shadow:0 5px 18px rgba(0,0,0,.05);

transition:.25s ease;

}

.product:active{

transform:scale(.98);

}

.product img{

width:100%;

aspect-ratio:1/1;

object-fit:cover;

display:block;

background:#ffffff;

}

/*========================
SHOP BUTTON
========================*/

.shop-btn{

width:78%;

margin:14px auto 16px;

padding:10px 0;

background:#111111;

color:#ffffff;

text-align:center;

font-size:13px;

font-weight:500;

border-radius:12px;

letter-spacing:.2px;

transition:background .2s ease;

}

.product:active .shop-btn{

background:#3a3a3a;

}

/*========================
FOOTER
========================*/

footer{

text-align:center;

padding:40px 0 10px;

font-size:13px;

color:#9b9b9b;

}

</style>

</head>

<body>

<header>

<h1>BAYAN STYLING</h1>

</header>

<div class="container">

<!-- 🖼️ MAIN LOOK IMAGE -->

<div class="hero-image">

<img src="https://i.ibb.co/Vc2B4Qr1/file-00000000851882109cdea451bf3634e4.png" alt="Main Look">

</div>

<div class="products">

<!-- ===== ITEM 1 ===== -->

<a class="product" href="https://amzn.to/4hNoKtn">

<img src="https://i.ibb.co/kgdq9pwg/1790366125233.jpg" alt="Item 1">

<div class="shop-btn">Shop on Amazon🛒</div>

</a>

<!-- ===== ITEM 2 ===== -->

<a class="product" href="https://amzn.to/4hbe4oi">

<img src="https://i.ibb.co/B5mr89fN/1790366125233-1.jpg" alt="Item 2">

<div class="shop-btn">Shop on Amazon🛒</div>

</a>

<!-- ===== ITEM 3 ===== -->

<a class="product" href="https://amzn.to/4rwry1j">

<img src="https://i.ibb.co/7NLRh67t/Photoroom-20260925-151908826.jpg" alt="Item 3">

<div class="shop-btn">Shop on Amazon🛒</div>

</a>

<!-- ===== ITEM 4 ===== -->

<a class="product" href="https://amzn.to/4hmFV3z">

<img src="https://i.ibb.co/fd93h1mr/Screenshot-20260925-225742-Photoroom.jpg" alt="Item 4">

<div class="shop-btn">Shop on Amazon🛒</div>

</a>

<!-- ===== ITEM 5 ===== -->

<a class="product" href="https://amzn.to/4yiBazr">

<img src="https://i.ibb.co/DHsj9jzL/Screenshot-20260902-113539-Amazon-Shopping.jpg" alt="Item 5">

<div class="shop-btn">Shop on Amazon🛒</div>

</a>

</div>

<footer>

BAYAN STYLING ©

<p style="margin-top:8px; font-size:11px; color:#b0b0b0; line-height:1.5;">

</p>

</footer>

</div>

</body>

</html>
